<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扬州市应急综合门户三期扩展版 · PC端 / App端 切换展示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: auto; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #e8ebf0;
    color: #333;
  }

  /* ===== 顶部切换栏（固定） ===== */
  .switch-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    height: 54px;
    background: linear-gradient(135deg, #1a3a6e 0%, #0d2752 100%);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  .switch-bar .sb-logo { display: flex; align-items: center; gap: 10px; margin-right: 8px; }
  .switch-bar .sb-logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #0082D9, #00b4d8);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 17px; font-weight: bold;
  }
  .switch-bar .sb-logo-text { color: #fff; font-size: 16px; font-weight: 600; }
  .switch-bar .sb-logo-text .en { font-size: 10px; color: rgba(255,255,255,0.5); font-weight: 400; margin-left: 6px; letter-spacing: 1px; }
  .switch-bar .sb-badge {
    font-size: 10px;
    color: #fff;
    background: linear-gradient(135deg, #C8102E, #e74c3c);
    padding: 2px 10px;
    border-radius: 10px;
    font-weight: 400;
  }
  .switch-bar .sb-divider { width: 1px; height: 24px; background: rgba(255,255,255,0.2); }
  .switch-bar .sb-tabs { display: flex; gap: 8px; background: rgba(255,255,255,0.08); border-radius: 8px; padding: 4px; }
  .switch-bar .sb-tab {
    padding: 6px 22px;
    border-radius: 6px;
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .switch-bar .sb-tab .tab-icon { font-size: 15px; }
  .switch-bar .sb-tab:hover { color: #fff; }
  .switch-bar .sb-tab.active {
    background: linear-gradient(135deg, #0082D9, #00b4d8);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,130,217,0.4);
  }
  .switch-bar .sb-right { margin-left: auto; font-size: 12px; color: rgba(255,255,255,0.5); }

  /* ===== 视图容器 ===== */
  .view-wrap { position: relative; padding-top: 54px; }

  /* ===== PC 视图（整页高度，随页面滚动） ===== */
  #view-pc { display: block; }
  #view-pc iframe {
    width: 100%;
    height: 1420px;
    border: none;
    display: block;
  }

  /* ===== App 视图（手机模拟器） ===== */
  #view-app {
    background: radial-gradient(ellipse at 30% 20%, #dfe7f2 0%, #c3cedd 60%, #aebacd 100%);
    display: none;
  }
  #view-app.active { display: block; }
  .app-stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 60px 24px 40px;
  }
  .phone-frame {
    width: 436px;
    height: 88vh;
    max-height: 920px;
    min-height: 640px;
    background: #1a1a1a;
    border-radius: 36px;
    padding: 10px;
    box-shadow:
      0 0 0 2px #2a2a2a,
      0 20px 60px rgba(0,0,0,0.45),
      inset 0 0 0 2px rgba(255,255,255,0.06);
    position: relative;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .phone-frame::before {
    content: "";
    position: absolute;
    top: 8px; left: 50%;
    transform: translateX(-50%);
    width: 96px; height: 22px;
    background: #1a1a1a;
    border-radius: 12px;
    z-index: 10;
  }
  .phone-frame iframe { flex: 1; width: 100%; height: 100%; border: none; border-radius: 28px; background: #f0f2f5; }
  .phone-label {
    position: absolute;
    bottom: -34px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.55);
    padding: 4px 14px;
    border-radius: 12px;
    white-space: nowrap;
  }

  .app-desc {
    color: rgba(30,50,90,0.75);
    max-width: 250px;
  }
  .app-desc .ad-title {
    font-size: 18px;
    font-weight: 700;
    color: #1a3a6e;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .app-desc .ad-title .ad-dot { width: 6px; height: 6px; background: #C8102E; border-radius: 50%; box-shadow: 0 0 8px rgba(200,16,46,0.6); }
  .app-desc .ad-item { font-size: 13px; line-height: 1.9; color: rgba(30,50,90,0.85); margin-bottom: 8px; }
  .app-desc .ad-item .tag {
    display: inline-block;
    background: rgba(0,130,217,0.1);
    color: #0082D9;
    border-radius: 4px;
    padding: 0 6px;
    font-size: 11px;
    margin-right: 4px;
  }
  .app-desc .ad-item .tag.new { background: rgba(200,16,46,0.08); color: #C8102E; }
</style>
</head>
<body>

<!-- ===== 顶部切换栏 ===== -->
<div class="switch-bar">
  <div class="sb-logo">
    <div class="sb-logo-icon">应</div>
    <div class="sb-logo-text">扬州市应急综合门户<span class="en">三期扩展版 · 双端展示</span></div>
    <span class="sb-badge">三期扩展版</span>
  </div>
  <div class="sb-divider"></div>
  <div class="sb-tabs">
    <div class="sb-tab active" data-view="pc" onclick="switchView('pc')">
      <span class="tab-icon">🖥</span>PC端
    </div>
    <div class="sb-tab" data-view="app" onclick="switchView('app')">
      <span class="tab-icon">📱</span>App端
    </div>
  </div>
  <div class="sb-right">扬州市应急管理局 · 门户三期建设规划演示</div>
</div>

<!-- ===== 视图容器 ===== -->
<div class="view-wrap">

  <!-- PC 视图 -->
  <div class="view active" id="view-pc">
    <iframe id="pcFrame" src="综合门户PC端_三期扩展版.html" frameborder="0"></iframe>
  </div>

  <!-- App 视图 -->
  <div class="view" id="view-app">
    <div class="app-stage">
      <div class="phone-frame">
        <iframe id="appFrame" src="综合门户App端_三期扩展版.html" frameborder="0"></iframe>
        <div class="phone-label">应急综合门户 · App端（三期扩展版）</div>
      </div>
      <div class="app-desc">
        <div class="ad-title"><span class="ad-dot"></span>三期扩展亮点</div>
        <div class="ad-item"><span class="tag new">新增</span>工业企业安全监管：建档15,236家、县市区监管排名</div>
        <div class="ad-item"><span class="tag new">新增</span>行政执法：本月检查56家、处罚23件、结案率87%</div>
        <div class="ad-item"><span class="tag new">新增</span>重大危险源：四色分级预警（红橙黄蓝）+ 包保履职</div>
        <div class="ad-item"><span class="tag new">新增</span>预案与演练、物联感知专线、数据治理成效</div>
        <div class="ad-item"><span class="tag">AI应用</span>应急问答助手、智能研判、AI执法小助手、预案管理</div>
      </div>
    </div>
  </div>

</div>

<script>
  // 自动校准 PC iframe 高度（file:// 同源可读时取内容高度；跨域时保持 CSS 默认 1420px）
  function fitPcFrame() {
    var f = document.getElementById('pcFrame');
    if (!f) return;
    try {
      var doc = f.contentDocument;
      if (doc && doc.documentElement && doc.documentElement.scrollHeight > 100) {
        f.style.height = doc.documentElement.scrollHeight + 8 + 'px';
      }
    } catch (e) { /* 跨域不可读，保持默认高度 */ }
  }

  function switchView(name) {
    var tabs = document.querySelectorAll('.sb-tab');
    tabs.forEach(function(t) {
      t.classList.toggle('active', t.getAttribute('data-view') === name);
    });
    var pc = document.getElementById('view-pc');
    var app = document.getElementById('view-app');
    if (name === 'pc') {
      pc.style.display = 'block';
      app.style.display = 'none';
      fitPcFrame();
    } else {
      app.style.display = 'block';
      pc.style.display = 'none';
      window.scrollTo(0, 0);
    }
  }

  // 页面加载后校准 + PC iframe 加载完成后再次校准
  window.addEventListener('load', function() {
    setTimeout(fitPcFrame, 800);
    setTimeout(fitPcFrame, 2500);
  });
  document.getElementById('pcFrame').addEventListener('load', function() {
    setTimeout(fitPcFrame, 500);
  });
</script>

</body>
</html>
